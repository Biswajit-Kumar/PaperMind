name: keep-backend-alive

# Render's free tier sleeps a web service after ~15 minutes of no traffic,
# and the next request pays a 30-60s wake-up cost. Pinging the health
# endpoint often enough keeps it warm, at the cost of running "hot"
# continuously (well within Render's 750 free instance-hours/month for a
# single service).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        # -m 90: a cold start can take 50s+ per Render's own dashboard warning,
        # so a 30s timeout was failing (and emailing) whenever GitHub's cron
        # fired late enough for the service to have gone to sleep first.
        # --retry: absorb one-off network blips instead of hard-failing on them.
        run: curl -sf -m 90 --retry 2 --retry-delay 5 https://papermind-backend-ukbh.onrender.com/api/health
